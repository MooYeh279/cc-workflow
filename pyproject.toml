[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-workflow"
version = "0.1.0"
description = "AI workflow orchestrator built on Claude Code CLI / OpenCode CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "MooYeh", email = "yangtao279@huawei.com"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-playwright",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/MooYeh279/cc-workflow"
Repository = "https://github.com/MooYeh279/cc-workflow"

[project.scripts]
wflow = "wflow.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wflow = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=src/wflow --cov-report=term-missing"
markers = [
    "e2e: End-to-end tests requiring Playwright browser + running server. Run separately with: pytest -m e2e",
]
